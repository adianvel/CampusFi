[package]
name = "campusfi"
version = "0.1.0"
description = "CampusFi reputation-based student loan protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "campusfi"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
